[project]
name = "green-api"
version = "0.1.0"
description = "FastAPI backend — the authoritative brain. Submit strategies, run the overfit gate (sandboxed), stream progress over WebSocket, fetch verdicts."
requires-python = ">=3.12"
dependencies = [
    "green-core",
    "green-adapters",
    "green-strategies",
    "green-sandbox",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/green"]
