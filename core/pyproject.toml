[project]
name = "green-core"
version = "0.1.0"
description = "The trust core: engine, MarketView, Strategy contract, recorder, overfit gate. Environment-agnostic."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/green"]
