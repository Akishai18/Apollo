[project]
name = "green-generator"
version = "0.1.0"
description = "NL → Strategy generator. Turns a plain-English description into a green.core.Strategy subclass (source), behind a provider abstraction (Claude / Gemini / offline mock). The output runs through the SAME sandbox + overfit gate — no trust shortcut."
requires-python = ">=3.12"
dependencies = [
    "green-core",
    "green-strategies",
    "pydantic>=2.10",
    "anthropic>=0.69",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/green"]
