[tool.uv.workspace]
members = ["core", "adapters", "strategies"]

[tool.uv.sources]
green-core = { workspace = true }
green-adapters = { workspace = true }
green-strategies = { workspace = true }

[dependency-groups]
dev = [
    "green-core",
    "green-adapters",
    "green-strategies",
    "ruff>=0.9",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "hypothesis>=6.120",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["core/src", "adapters/src", "strategies/src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = [
    "core/src",
    "core/tests",
    "adapters/src",
    "adapters/tests",
    "strategies/src",
    "strategies/tests",
]

[tool.pytest.ini_options]
testpaths = ["core/tests", "adapters/tests", "strategies/tests"]
addopts = "-ra"
