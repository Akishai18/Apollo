# Render Blueprint for the Apollo API (the FastAPI backend).
# Deploy: Render dashboard → New → Blueprint → pick this repo. Then set the
# `sync: false` secrets in the service's Environment tab.
services:
  - type: web
    name: apollo-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # free spins down on idle (cold WebSocket reconnects); starter stays warm
    healthCheckPath: /healthz
    envVars:
      - key: GREEN_STORE
        value: postgres
      # --- secrets: set these in the Render dashboard (Environment tab) ---
      - key: GREEN_DATABASE_URL # Supabase Postgres connection string
        sync: false
      - key: GREEN_SUPABASE_URL # https://<ref>.supabase.co — enables JWKS auth
        sync: false
      - key: GREEN_CORS_ORIGINS # your Vercel URL(s), comma-separated
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GREEN_DATABRICKS_HOST
        sync: false
      - key: GREEN_DATABRICKS_HTTP_PATH
        sync: false
      - key: GREEN_DATABRICKS_TOKEN
        sync: false
      - key: GREEN_MARKET_TABLE
        sync: false
      # --- optional ---
      - key: GREEN_MLFLOW_TRACKING_URI
        sync: false
      - key: GREEN_MLFLOW_EXPERIMENT
        sync: false
