[project]
name = "green-sandbox"
version = "0.1.0"
description = "Process isolation around untrusted strategy code. The strategy runs in a locked-down child process; only a JSON-line protocol crosses the boundary."
requires-python = ">=3.12"
dependencies = [
    "green-core",
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/green"]
