[project]
name = "green-strategies"
version = "0.1.0"
description = "Canonical example strategies (also reference material for the generator)."
requires-python = ">=3.12"
dependencies = ["green-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/green"]

[tool.uv.sources]
green-core = { workspace = true }
